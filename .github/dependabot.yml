version: 2
registries:
  # Keep hash lookups on an absolute PyPI URL. Dependabot's UV updater can
  # otherwise pass an empty index from unrelated credentials to hashin
  # (run 37258615411: unknown url type '/pypi/rpds-py/json').
  public-pypi:
    type: python-index
    url: https://pypi.org/simple
    replaces-base: true
updates:
  - package-ecosystem: "uv"
    directory: "/"
    registries:
      - public-pypi
    exclude-paths:
      - "NICHTRAUM/archive/**"
    groups:
      python-lock:
        patterns: ["*"]
      python-lock-security:
        applies-to: security-updates
        patterns: ["*"]
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "FOKUS: deps"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 5

  # directory muss auf den pnpm-Workspace-Root zeigen (pnpm-lock.yaml liegt dort);
  # mit "/ui-app" bumpte Dependabot nur ui-app/package.json, der Root-Lockfile
  # blieb stehen und jeder npm-PR failte an pnpm install --frozen-lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    # TypeScript 7 (Go-Compiler) bricht den Lint: typescript-eslint, das
    # eslint-config-next einbindet, erlaubt nur typescript <6.1.0 (Stand
    # 2026-10-18, OUT/upstream_radar_2026-10-18.md). Entfernen, sobald
    # typescript-eslint TS 7 unterstützt. Security-Updates gelten weiter.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "FOKUS: deps"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "FOKUS: deps"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 3
