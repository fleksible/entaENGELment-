name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run JavaScript tests
        run: pnpm run test:js

      - name: Run JavaScript tests with coverage
        run: pnpm run test:js:coverage

      - name: Upload JS coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: js-coverage-report
          path: coverage/js/
          retention-days: 14

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: uv.lock

      - name: Install Python dependencies
        uses: ./.github/actions/python-locked
        with:
          group: fractalsense

      - name: Run Python tests
        run: |
          cd Fractalsense
          python -m pytest --cov --cov-report=xml --cov-report=html

      - name: Upload Python coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-coverage-report-${{ matrix.python-version }}
          path: Fractalsense/htmlcov/
          retention-days: 14

  ui-build:
    name: UI Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm --filter entaengelment-ui build

  all-tests-pass:
    name: All Tests Pass
    needs: [test-javascript, test-python, ui-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to succeed
        env:
          JS_RESULT: ${{ needs.test-javascript.result }}
          PYTHON_RESULT: ${{ needs.test-python.result }}
          UI_RESULT: ${{ needs.ui-build.result }}
        run: |
          test "$JS_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$UI_RESULT" = success
          echo "All JavaScript, Python, and UI build checks passed successfully!"
