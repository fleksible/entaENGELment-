name: SBOM Generation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked runtime
        uses: ./.github/actions/python-locked

      - name: Generate and reconcile Python SBOM
        run: |
          UV_PROJECT_ENVIRONMENT=.sbom-tools python tools/python_lock.py sync --group sbom
          .sbom-tools/bin/cyclonedx-py environment .venv/bin/python \
            --pyproject pyproject.toml \
            --spec-version 1.6 \
            --output-reproducible \
            --output-format JSON \
            --output-file sbom-python.cdx.json
          python tools/python_lock.py verify-sbom --sbom sbom-python.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-sbom
          path: sbom-python.cdx.json
          if-no-files-found: error
          retention-days: 90
