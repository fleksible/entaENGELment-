version: "0.1"
status: "draft"
claim_status: "[SPEC-WIP]"
updated: "2026-09-23"
purpose: "Document expected repository review posture as policy-as-code. This file does not prove that settings are active."

branch: "main"
expected:
  pull_request_review: true
  include_admins: true
  required_checks:
    - "Verify Pointers & Lint (blocking)"
    - "deepjump-audit / deepjump-audit"
    - "All Tests Pass"
    - "Lint · Format · Types · SAST"
    - "Check PR for FOKUS marker"
  conditional_checks:
    - "workspace"
    - "JS dependency audit (pnpm)"
    - "Python dependency audit (pip-audit)"
  future_checks:
    - "Guard-Check-Lint"
    - "Branch-State-Drift-Check"
  signed_evidence_status:
    distinguish:
      - "VERIFY_PASS"
      - "VERIFY_PASS_UNSIGNED"
      - "SIGNED_EVIDENCE_PASS"
      - "SIGNED_EVIDENCE_SKIPPED"
      - "SIGNED_EVIDENCE_FAIL"

notes:
  - "This file describes target posture and must be compared to live repository settings before enforcement is claimed."
  - "Conditional checks use workflow path filters; do not require them globally without an always-running dispatcher. Verify exact contexts on a current PR before changing settings."
