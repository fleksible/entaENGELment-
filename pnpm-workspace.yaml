# EntaENGELment — pnpm workspace
# Additive JS/TS membrane over the existing islands. The Python domain
# (src/, tools/, tests/, bio_spiral_viewer/) remains sovereign and is NOT
# a workspace member — see SYNTHBIOSIS.md.
packages:
  - "ui-app"
  - "packages/*"

# Supply-chain cooldown: install no version younger than 1 day (minutes).
# Matches the pnpm 11 default; pnpm 10 defaults to 0. Dependabot version
# updates already wait 3 days; this also covers local and manual installs.
# Urgent security fix younger than a day: add it to minimumReleaseAgeExclude
# with a dated reason instead of lowering this value.
# Dependabot itself resolves with minimum-release-age=4320 (3 days) over the
# whole lockfile: after a manual bump to an exactly pinned version younger
# than 3 days, every npm version update fails with
# ERR_PNPM_NO_MATURE_MATCHING_VERSION until that version matures (seen
# 2026-10-18 after next 16.4.2). Expected and self-healing; no action needed.
minimumReleaseAge: 1440

# Security floors for transitive dependencies. Keep these at the workspace
# root so the pnpm version pinned in package.json applies them consistently.
overrides:
  "form-data@>=4.0.0 <4.0.6": ">=4.0.6"
  "postcss@<8.5.23": "8.5.23"
  "js-yaml@<=4.1.1": ">=4.2.0"
  "app-builder-lib@26.15.3>js-yaml": "5.4.3"
  "@istanbuljs/load-nyc-config@1.1.0>js-yaml": "5.4.3"
  "@eslint/eslintrc@3.3.5>js-yaml": "5.4.3"
  "builder-util@26.15.3>js-yaml": "5.4.3"
  "dmg-builder@26.15.3>js-yaml": "5.4.3"
  "undici@<6.29.1": "6.29.1"
  "undici@>=7.0.0 <7.30.1": "7.30.1"
  "brace-expansion@<1.1.16": "^1.1.16"
  "brace-expansion@>=2.0.0 <2.1.2": "^2.1.2"
  "minimatch@3.1.5>brace-expansion": "5.0.12"
  "minimatch@5.1.9>brace-expansion": "5.0.12"
  "minimatch@9.0.9>brace-expansion": "5.0.12"
  "minimatch@10.2.5>brace-expansion": "5.0.12"
  "fast-uri@>=3.0.0 <3.1.8": "3.1.8"
  "sharp@<0.35.5": "0.35.5"
  "tar@<=7.5.20": "7.5.22"
  "nanoid@<3.3.18": "3.3.18"
  "browserslist@<4.28.7": "4.28.7"
  "@xmldom/xmldom@>=0.7.0 <0.8.15": "0.8.15"
  "baseline-browser-mapping@>=2.0.0 <2.11.0": "2.11.0"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "http-cache-semantics@<4.3.0": "4.3.0"

# brace-expansion v5 drops the callable CommonJS and default ESM shapes expected
# by older minimatch majors in electron-builder. Keep the named v5 API and
# restore both legacy shapes; the packaging glob regression test covers the
# CommonJS consumers and @electron/universal's published ESM entry.
patchedDependencies:
  brace-expansion@5.0.12: patches/brace-expansion@5.0.12.patch

# Audit exceptions: each entry needs an advisory without any patched release
# AND a dependency path that never processes untrusted input. Revisit on every
# weekly Security Audit run and remove the entry as soon as a fix ships.
# - GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, high, no patched version):
#   only reachable via ui-app > eslint-config-next > @next/eslint-plugin-next >
#   fast-glob > micromatch > braces, i.e. dev-time linting of repo-authored
#   glob patterns. Not shipped in the Electron app or the Next.js build output.
#   Rechecked 2026-10-09: still no patched release; installed dependency path
#   confirmed with pnpm why. Evidence/limits: OUT/dependency_review_2026-10-09.md.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
